name: Python CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: anjali-sinha/deployment-pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      vars.STAGING_INSTANCE_ID != ''

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      IMAGE_URI: ghcr.io/anjali-sinha/deployment-pipeline:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: staging-deploy-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy image through SSM
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(jq -n --arg image "$IMAGE_URI" '{
            commands: [
              "set -eu",
              ("docker pull " + $image),
              "docker rm -f deployment-demo >/dev/null 2>&1 || true",
              ("docker run -d --name deployment-demo --restart unless-stopped -p 5000:5000 " + $image),
              "for i in $(seq 1 15); do if curl -fsS http://localhost:5000/health; then exit 0; fi; sleep 2; done",
              "docker logs deployment-demo",
              "exit 1"
            ]
          }')"

          command_id="$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_URI}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "Started SSM command: $command_id"

          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$STAGING_INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$STAGING_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml

          exit "$wait_status"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROD_INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
      IMAGE_URI: ghcr.io/anjali-sinha/deployment-pipeline:${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: production-deploy-${{ github.run_id }}

      - name: Deploy production demo through SSM
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(jq -n --arg image "$IMAGE_URI" '{
            commands: [
              "set -eu",
              ("docker pull " + $image),
              "docker rm -f deployment-demo-prod >/dev/null 2>&1 || true",
              ("docker run -d --name deployment-demo-prod --restart unless-stopped -p 5001:5000 " + $image),
              "for i in $(seq 1 15); do if curl -fsS http://localhost:5001/health; then exit 0; fi; sleep 2; done",
              "docker logs deployment-demo-prod",
              "exit 1"
            ]
          }')"

          command_id="$(aws ssm send-command \
            --instance-ids "$PROD_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Production demo deployment ${IMAGE_URI}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "Started SSM command: $command_id"

          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$PROD_INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$PROD_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml

          exit "$wait_status"
